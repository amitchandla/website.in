<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — BizGrow AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="/index.html" class="brand" style="color:#fff;"><span class="brand-mark">BG</span> BizGrow AI</a>
    <div>
      <p class="quote">We'll email you a secure link to reset your password.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter your account email and we'll send you a reset link.</p>

      <div class="form-msg" id="formMsg"></div>

      <form id="forgotForm" novalidate>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@business.com" />
          <span class="err-msg"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Reset Link</button>
      </form>

      <p class="auth-alt"><a href="/login.html">Back to log in</a></p>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="/js/config.js" defer></script>
<script src="/js/supabaseClient.js" defer></script>
<script src="/js/utils.js" defer></script>
<script src="/js/auth.js" defer></script>
</body>
</html>
