<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — BizGrow AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="/index.html" class="brand" style="color:#fff;"><span class="brand-mark">BG</span> BizGrow AI</a>
    <div>
      <p class="quote">"Open the website → choose your business → click what you need → AI does the work."</p>
      <p class="quote-by">7-DAY FREE TRIAL · NO CARD REQUIRED</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1>Create your account</h1>
      <p class="sub">Start your 7-day free trial. No card needed.</p>

      <div class="form-msg" id="formMsg"></div>

      <form id="signupForm" novalidate>
        <div class="field" id="f-name">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" autocomplete="name" placeholder="e.g. Priya Sharma" />
          <span class="err-msg"></span>
        </div>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@business.com" />
          <span class="err-msg"></span>
        </div>
        <div class="field" id="f-password">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" />
          <span class="hint">Use 8+ characters with a mix of letters and numbers.</span>
          <span class="err-msg"></span>
        </div>
        <div class="field" id="f-confirm">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" />
          <span class="err-msg"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Start 7 Days Free</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="/js/config.js" defer></script>
<script src="/js/supabaseClient.js" defer></script>
<script src="/js/utils.js" defer></script>
<script src="/js/auth.js" defer></script>
</body>
</html>
